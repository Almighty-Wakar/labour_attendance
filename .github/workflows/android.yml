name: Android Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project root and build
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Android Studio project (settings.gradle*) found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug bundleRelease --no-daemon
          else
            gradle assembleDebug bundleRelease --no-daemon
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/bundle/release/*.aab
