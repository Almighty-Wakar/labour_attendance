name: Build Android APK & App Bundle (.aab)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Required by Capacitor 8 / AGP)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate Capacitor Android project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK & Release App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labour-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labour-attendance-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish APK & AAB to GitHub Release (on version tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
